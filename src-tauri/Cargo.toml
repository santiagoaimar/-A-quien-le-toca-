[package]
name = "quien-le-toca"
version = "1.0.0"
description = "¿A quién le toca? - App de rotaciones Lehmann"
authors = ["Lehmann IT"]
edition = "2021"

[lib]
name = "quien_le_toca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
